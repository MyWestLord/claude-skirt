<text x="300" y="288" fill="#e8e8e8" font-size="22" font-weight="600" text-anchor="middle">E-PG</text>
<text x="300" y="316" fill="#a9a9a9" font-size="14" text-anchor="middle">16 wedges, one bump</text>
<line x1="300" y1="332" x2="300" y2="194" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
<circle cx="300" cy="86" r="9" fill="#5680c2"/>
<text x="318" y="91" fill="#a9c1ea" font-size="14">visual landmark</text>
<rect x="40" y="276" width="26" height="150" rx="4" fill="#2e2e2e"/><rect x="40" y="356" width="26" height="70" rx="4" fill="#d97757"/>
<text x="53" y="451" fill="#a9a9a9" font-size="14" text-anchor="middle">P-EN L</text>
<rect x="534" y="276" width="26" height="150" rx="4" fill="#2e2e2e"/><rect x="534" y="416" width="26" height="10" rx="4" fill="#d97757"/>
<text x="547" y="451" fill="#a9a9a9" font-size="14" text-anchor="middle">P-EN R</text>
<path d="M66 272 Q 80 176 132 226" fill="none" stroke="#f0a080" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="180" y="526" fill="#a9a9a9" font-size="14" text-anchor="end">Δ7</text>
<rect x="192" y="515" width="216" height="12" rx="6" fill="#2e2e2e"/><rect x="192" y="515" width="92" height="12" rx="6" fill="#8a8a8a"/>
<text x="418" y="526" fill="#7d7d7d" font-size="13">global inhibition</text>
<g font-size="16" fill="#d9d9d9">
<text x="640" y="104" fill="#e8e8e8" font-size="19" font-weight="600">1. The choreography asks for a turn</text>
<text x="640" y="130">"Pirouette, three turns" becomes a turn-rate command.</text>
<text x="640" y="176" fill="#e8e8e8" font-size="19" font-weight="600">2. P-EN neurons shift the bump</text>
<text x="640" y="202">Left or right P-EN cells project one wedge over,</text>
<text x="640" y="224">so the bump of activity slides around the ring.</text>
<text x="640" y="270" fill="#e8e8e8" font-size="19" font-weight="600">3. Her body follows the bump</text>
<text x="640" y="296">The decoded bump angle is her yaw, every frame.</text>
<text x="640" y="342" fill="#e8e8e8" font-size="19" font-weight="600">4. A landmark keeps her honest</text>
<text x="640" y="368">Without it, small errors pile up and she drifts.</text>
</g>
<text x="640" y="440" fill="#f0a080" font-size="15" font-weight="600" letter-spacing="2.5">HER STEPS: A HALF-CENTER OSCILLATOR</text>
<g font-size="15" fill="#d9d9d9">
<rect x="640" y="462" width="132" height="44" rx="8" fill="#2e2e2e"/><text x="706" y="489" text-anchor="middle">beat → JO</text>
<line x1="776" y1="484" x2="828" y2="484" stroke="#d9d9d9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="832" y="462" width="148" height="44" rx="8" fill="#2e2e2e"/><text x="906" y="489" text-anchor="middle">CPG ⇄ CPG</text>
<line x1="984" y1="484" x2="1036" y2="484" stroke="#d9d9d9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1040" y="462" width="124" height="44" rx="8" fill="#2e2e2e"/><text x="1102" y="489" text-anchor="middle">pointe steps</text>
</g>
<text x="640" y="534" fill="#7d7d7d" font-size="13">JO is Johnston's organ, the antenna "ear" of a fly.</text>
<text x="640" y="554" fill="#7d7d7d" font-size="13">The two CPG neurons inhibit each other and tire out in turn.</text>
</svg>